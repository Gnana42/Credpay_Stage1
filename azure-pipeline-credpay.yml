pool:
  vmImage: ubuntu-latest

variables:
  acrserviceconnection: 'ACRSC'
  frontendrepository: 'credpay/frontend'
  userrepository: 'credpay/user-service'
  paymentrepository: 'credpay/payment-service'
  tag: '$(Build.BuildId)'

stages:
  - stage: terraform
    displayName: Terraform Infra
    jobs:
      - job: terraformapply
        displayName: terraform init and apply
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: "Terraform Initialization"
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: Terraform
              backendAzureRmUseEntraIdForAuthentication: false
              backendServiceArm: 'Jarvis-Manual'
              backendAzureRmResourceGroupName: 'Capstone-RG'
              backendAzureRmStorageAccountName: 'credbackendstorage'
              backendAzureRmContainerName: 'statefile'
              backendAzureRmKey: 'credpay.terraform.tfstate'

          - task: TerraformTask@5
            displayName: "Terraform files Validation"
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: Terraform

          - task: TerraformTask@5
            displayName: "Terraform Plan"
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: Terraform
              environmentServiceNameAzureRM: 'Jarvis-Manual'


































